<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Collection</title>

    <style>

        body{
            font-family:Arial;
            background:#f4fff4;
            padding:30px;
        }

        .container{
            width:500px;
            margin:auto;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0 0 10px lightgray;
        }

        h2{
            text-align:center;
            color:green;
        }

        label{
            font-weight:bold;
        }

        input,select{
            width:100%;
            padding:10px;
            margin-top:5px;
            margin-bottom:15px;
        }

        button{
            width:100%;
            padding:12px;
            background:#198754;
            color:white;
            border:none;
            font-size:18px;
            cursor:pointer;
        }

        button:hover{
            background:#146c43;
        }
        @media (max-width:768px){

.container{
    flex-direction:column;
}

.sidebar{
    width:100%;
    min-height:auto;
}

.cards{
    flex-direction:column;
}

.card{
    width:100%;
}

table{
    display:block;
    overflow-x:auto;
}

}

    </style>

</head>

<body>

<div class="container">

<h2>💰 Payment Collection</h2>

<form action="/save_payment/{{ customer.id }}" method="POST">

<label>Customer Name</label>
<input type="text"
value="{{ customer.name }}"
readonly>

<label>Payment Date</label>
<input type="date"
name="payment_date"
required>

<label>Amount</label>

<input
type="number"
step="0.01"
name="amount"
required>

<label>Payment Method</label>

<select name="payment_method">

<option>Cash</option>

<option>UPI</option>

<option>Bank Transfer</option>

</select>

<label>Status</label>

<select name="status">

<option>Paid</option>

<option>Pending</option>

</select>

<button type="submit">
Save Payment
</button>

</form>

<br>

<a href="/payments">
⬅ Back to Payments
</a>

</div>

</body>
</html>
