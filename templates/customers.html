<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Customer</title>
<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css">

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <style>

    body{
        font-family:Arial;
        background:#f5f5f5;
    }

    .container{

        width:700px;
        margin:30px auto;
        background:white;
        padding:25px;
        border-radius:10px;
        box-shadow:0px 0px 10px lightgray;

    }

    h2{

        text-align:center;
        color:green;

    }

    input,
    textarea,
    select{

        width:100%;
        padding:10px;
        margin:8px 0;

    }

    button{

        width:100%;
        padding:12px;
        background:green;
        color:white;
        border:none;
        font-size:18px;
        cursor:pointer;

    }

    @media (max-width:768px){

.container{
    flex-direction:column;
}

.sidebar{
    width:100%;
    min-height:auto;
}

.cards{
    flex-direction:column;
}

.card{
    width:100%;
}

table{
    display:block;
    overflow-x:auto;
}

}

    </style>

</head>

<body>

<div class="container">

<h2>🥛 Add Customer</h2>

<form action="/save_customer" method="POST">

<label>Customer Name</label>
<input type="text" name="name" required>

<label>House Number</label>
<input type="text" name="house_no">

<label>Phone Number</label>
<input type="text" name="mobile">

<label>Address</label>
<textarea name="address"></textarea>

<label>Route</label>
<input type="text" name="route">

<label>Morning Milk (L)</label>
<select name="morning">
<option>0</option>
<option>0.5</option>
<option>1</option>
<option>1.5</option>
<option>2</option>
<option>3</option>
</select>

<label>Evening Milk (L)</label>
<select name="evening">
<option>0</option>
<option>0.5</option>
<option>1</option>
<option>1.5</option>
<option>2</option>
<option>3</option>
</select>

<label>Price Per Litre</label>
<input type="number" step="0.01" name="price_per_litre">

<label>Start Date</label>
<input type="date" name="start_date">

<label>Status</label>
<select name="status">
<option>Active</option>
<option>Inactive</option>
</select>
<input type="hidden" name="latitude" id="latitude">

<input type="hidden" name="longitude" id="longitude">
<h3>Select Customer Location</h3>

<div id="map"
style="height:350px;
margin-bottom:20px;
border:2px solid green;">
</div>
<button type="submit">Save Customer</button>

</form>

</div>
<script>

var map = L.map('map').setView([11.0168,76.9558],13);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:19
}
).addTo(map);

var marker;

map.on('click',function(e){

    if(marker){
        map.removeLayer(marker);
    }

    marker=L.marker(e.latlng).addTo(map);

    document.getElementById("latitude").value=e.latlng.lat;
    document.getElementById("longitude").value=e.latlng.lng;

});

</script>
</body>
</html>
